apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xnamespaceconfigmaps.platform.crossplane.io

spec:
  group: platform.crossplane.io

  names:
    kind: XNamespaceConfigMap
    plural: xnamespaceconfigmaps

  claimNames:
    kind: NamespaceConfigMap
    plural: namespaceconfigmaps

  defaultCompositionRef:
    name: namespace-configmap-composition

  defaultCompositeDeletePolicy: Background

  versions:
    - name: v1alpha1

      served: true
      referenceable: true

      additionalPrinterColumns:
        - name: Namespace
          type: string
          jsonPath: .spec.namespace

        - name: ConfigMap
          type: string
          jsonPath: .spec.configMapName

        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].status

        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status

      schema:
        openAPIV3Schema:

          type: object

          properties:

            spec:

              type: object

              properties:

                compositionRef:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true

                compositionSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true

                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string

                namespace:
                  type: string
                  minLength: 1

                configMapName:
                  type: string
                  minLength: 1

                labels:
                  type: object
                  additionalProperties:
                    type: string

                annotations:
                  type: object
                  additionalProperties:
                    type: string

                configMapData:
                  type: object
                  additionalProperties:
                    type: string

              required:
                - namespace
                - configMapName

            status:

              type: object

              properties:

                namespace:
                  type: string

                configMapName:
                  type: string

                observedGeneration:
                  type: integer

                conditions:
                  type: array
                  x-kubernetes-preserve-unknown-fields: true