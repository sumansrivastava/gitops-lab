apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compositions
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sumansrivastava/gitops-lab.git
    targetRevision: main
    path: platform/compositions

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true